name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'leaderboard.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync leaderboard data
        run: |
          mkdir -p docs/assets/data docs/_data
          cp leaderboard.json docs/assets/data/leaderboard.json
          cp leaderboard.json docs/_data/leaderboard.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_push: true
