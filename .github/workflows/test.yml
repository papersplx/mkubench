name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest
      
      - name: Check environment
        run: |
          python3 -c "import requests, yaml, PyPDF2, pdfplumber, ebooklib, bs4; print('All dependencies OK')"
      
      - name: Run parser tests
        run: |
          python3 src/parser.py
      
      - name: Run unit tests
        run: |
          python3 -m unittest discover tests/ -v
      
      - name: Verify dataset
        run: |
          python3 -c "from src.evaluator import BenchmarkEvaluator; e = BenchmarkEvaluator('dataset/mkultra_benchmark.jsonl'); print(f'Loaded {len(e.dataset)} questions')"
