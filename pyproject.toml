[project]
name = "mkultra-benchmark"
version = "1.0.0"
description = "Automated LLM benchmark for MKULTRA evaluation (MMLU-style)"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.10.0",
    "ebooklib>=0.19.0",
    "youtube-transcript-api>=1.2.0",
    "yt-dlp>=2024.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run_benchmark", "build_dataset", "fetch_yt_transcripts"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
exclude = ["tests*", "docs*"]

[project.scripts]
mkultra-bench = "run_benchmark:main"
build-dataset = "build_dataset:main"
fetch-youtube = "fetch_yt_transcripts:main"
regenerate-dataset = "scripts.regenerate_dataset:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
